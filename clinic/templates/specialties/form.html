<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Especialidad</title>
</head>

<body>

    <h1>Crear Especialidad</h1>

    <hr>

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="name"
               placeholder="Nombre">

        <br><br>

        <textarea name="description"
                  placeholder="Descripción"></textarea>

        <br><br>

        <button type="submit">
            Guardar
        </button>

    </form>

    <br>

    <a href="/specialties/">
        Volver
    </a>

</body>

</html>
